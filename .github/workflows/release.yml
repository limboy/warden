# Builds macOS DMGs (Apple Silicon + Intel) and publishes them as a GitHub
# Release whenever a version tag is pushed:
#
#   npm version 0.1.0 && git push --follow-tags
#
# Signing and notarization are optional. If the secrets below are set, the app
# is signed with the Developer ID certificate and notarized; otherwise it gets
# an ad-hoc signature and users have to approve it once in System Settings.
#
#   CSC_LINK          base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD  password of the .p12 (omit if it has none)
#   APPLE_API_KEY_P8  contents of the App Store Connect API key (AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID  ID of that key (the XXXX in the file name)
#   APPLE_API_ISSUER  issuer ID shown above the keys list in App Store Connect

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm test

      # Import the certificate ourselves instead of passing CSC_LINK to
      # electron-builder: its own import unlocks the temp keychain with the .p12
      # password, which fails for a .p12 exported without one.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "No CSC_LINK secret; the app will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build DMGs
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Unset empty secrets so electron-builder skips notarization instead
          # of failing on blank values.
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -z "${!name}" ]] && unset "$name"
          done
          # electron-builder expects APPLE_API_KEY to be a path to the .p8 file.
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          fi
          unset APPLE_API_KEY_P8
          # Signs with the Developer ID found in the keychain, or ad-hoc if none.
          npm run build
          npx electron-builder --mac dmg --arm64 --x64 --publish never

      # LZMA-compressed DMGs are ~30% smaller than electron-builder's default
      # (zlib), and its config doesn't offer this format. Needs macOS 10.15+,
      # below Electron's own minimum.
      - name: Recompress DMGs
        run: |
          for dmg in release/*.dmg; do
            hdiutil convert -quiet "$dmg" -format ULMO -o "${dmg%.dmg}.ulmo.dmg"
            mv "${dmg%.dmg}.ulmo.dmg" "$dmg"
          done
          ls -la release/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: warden-mac
          path: release/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          ## Install

          1. Download the DMG for your Mac: **arm64** for Apple Silicon (M1 and later), **x64** for Intel.
          2. Open it and drag **Warden** into **Applications**.
          NOTES
          if [[ "$SIGNED" != "true" ]]; then
            cat >> "$notes" <<'NOTES'
          3. This build is not notarized by Apple, so macOS blocks the first launch.
             Open Warden once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
             Or run: `xattr -dr com.apple.quarantine /Applications/Warden.app`
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --title "Warden ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --generate-notes
